name: Build Mobile App (Capacitor)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # URL deploy Vercel — set sebagai GitHub Repository Variable "VITE_API_BASE"
  # (Settings → Secrets and variables → Actions → Variables).
  VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://animetube.vercel.app' }}
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
  KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app (VITE_API_BASE di-bake ke bundle)
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Configure release signing (keystore secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: node scripts/apply-release-signing.mjs

      - name: Build signed release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Rename release APK → animetube.apk
        working-directory: android/app/build/outputs/apk/release
        run: mv app-release.apk animetube.apk

      - name: Upload release APK (animetube.apk)
        uses: actions/upload-artifact@v4
        with:
          name: animetube.apk
          path: android/app/build/outputs/apk/release/animetube.apk
          if-no-files-found: error

      - name: Rename release AAB → animetube-release.aab
        working-directory: android/app/build/outputs/bundle/release
        run: mv app-release.aab animetube-release.aab

      - name: Upload release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: animetube-release.aab
          path: android/app/build/outputs/bundle/release/animetube-release.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned, simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (VITE_API_BASE di-bake ke bundle)
        run: npm run build

      - name: Add Capacitor iOS platform
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: Build unsigned .app (simulator)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app → animetube-ios.app.zip
        working-directory: ios/App/build/Build/Products/Debug-iphonesimulator
        run: zip -r animetube-ios.app.zip App.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: animetube-ios
          path: ios/App/build/Build/Products/Debug-iphonesimulator/animetube-ios.app.zip
          if-no-files-found: error

  release:
    name: GitHub Release + Changelog
    needs: [android, ios]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}-build-$(date +%Y%m%d-%H%M)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Generate changelog (commit sejak tag terakhir)
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=""
          if [ -n "$PREV" ] && [ "$(git rev-list --count "$PREV..HEAD" 2>/dev/null || echo 0)" -gt 0 ]; then
            RANGE="$PREV..HEAD"
          fi
          if [ -z "$RANGE" ]; then
            RANGE="HEAD~15..HEAD"
          fi
          {
            echo "## Yang Baru di v$(node -p "require('./package.json').version")"
            echo ""
            git log --oneline --no-merges "$RANGE" | sed 's/^/- /'
          } > changelog.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "AnimeTube $TAG" \
            --notes "$(cat changelog.md)" \
            release-assets/*