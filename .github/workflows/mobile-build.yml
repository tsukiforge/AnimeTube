name: Build Mobile App (Capacitor)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # URL deploy Vercel — set sebagai GitHub Repository Variable "VITE_API_BASE"
  # (Settings → Secrets and variables → Actions → Variables).
  VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://animtubev1.vercel.app' }}
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
  KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump versi sebelum build (agar versi di APK = versi release)
        run: node scripts/next-version.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app (VITE_API_BASE di-bake ke bundle)
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Patch native permissions (voice search / mic)
        run: node scripts/apply-native-permissions.mjs

      - name: Generate app icons & splash (assets/)
        run: npx capacitor-assets generate --iconBackgroundColor '#0f0f0f' --splashBackgroundColor '#0f0f0f'

      - name: Configure release signing (keystore secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: node scripts/apply-release-signing.mjs

      - name: Build signed release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Rename release APK → animetube.apk
        working-directory: android/app/build/outputs/apk/release
        run: |
          APK=$(ls app-release*.apk | head -1)
          mv "$APK" animetube.apk

      - name: Upload release APK (animetube.apk)
        uses: actions/upload-artifact@v4
        with:
          name: animetube.apk
          path: android/app/build/outputs/apk/release/animetube.apk
          if-no-files-found: error

      - name: Rename release AAB → animetube-release.aab
        working-directory: android/app/build/outputs/bundle/release
        run: |
          AAB=$(ls app-release*.aab | head -1)
          mv "$AAB" animetube-release.aab

      - name: Upload release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: animetube-release.aab
          path: android/app/build/outputs/bundle/release/animetube-release.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned, .ipa + simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Bump versi sebelum build (agar versi di .ipa = versi release)
        run: node scripts/next-version.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (VITE_API_BASE di-bake ke bundle)
        run: npm run build

      - name: Add Capacitor iOS platform
        run: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: Patch native permissions (voice search / mic)
        run: node scripts/apply-native-permissions.mjs

      - name: Generate app icons & splash (assets/)
        run: npx capacitor-assets generate --iconBackgroundColor '#0f0f0f' --splashBackgroundColor '#0f0f0f'

      - name: Build unsigned .ipa (device, untuk sideload)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa (Payload/App.app)
        working-directory: ios/App/build-device/Build/Products/Debug-iphoneos
        run: |
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r animetube-ios.ipa Payload

      - name: Upload iOS .ipa (untuk Sideloadly/AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: animetube-ios.ipa
          path: ios/App/build-device/Build/Products/Debug-iphoneos/animetube-ios.ipa
          if-no-files-found: error

      - name: Build unsigned .app (simulator)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app → animetube-ios.app.zip
        working-directory: ios/App/build/Build/Products/Debug-iphonesimulator
        run: zip -r animetube-ios.app.zip App.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: animetube-ios
          path: ios/App/build/Build/Products/Debug-iphonesimulator/animetube-ios.app.zip
          if-no-files-found: error

  release:
    name: GitHub Release + Changelog
    needs: [android, ios]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Auto-bump version & create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commit bump atas nama author commit yang memicu workflow (bukan bot)
          AUTHOR_NAME=$(git log -1 --format='%an')
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          # Bump versi dengan logika yang SAMA dengan job build (scripts/next-version.mjs),
          # supaya versi di APK/.ipa cocok dengan tag release.
          node scripts/next-version.mjs
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if ! git diff --quiet package.json package-lock.json; then
            echo "Versi di-bump ke ${TAG}"
            # [skip ci] agar commit bump ini tidak memicu workflow lagi (anti infinite loop)
            git add package.json package-lock.json
            git commit -m "[skip ci] chore: bump version to ${TAG}"
            git push origin HEAD:main
          fi

          # Generate changelog dari commits
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=""
          if [ -n "$PREV" ] && [ "$(git rev-list --count "$PREV..HEAD" 2>/dev/null || echo 0)" -gt 0 ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi

          {
            echo "# AnimeTube v${VERSION}"
            echo ""
            echo "[🌐 Web App](https://animtubev1.vercel.app) · [📱 Android APK](https://github.com/tsukiforge/AnimeTube/releases/download/${TAG}/animetube.apk) · [🍎 iOS .ipa](https://github.com/tsukiforge/AnimeTube/releases/download/${TAG}/animetube-ios.ipa)"
            echo ""
            echo "## 📥 Downloads"
            echo "- **Android**: \`animetube.apk\` — install langsung di HP (izin install dari sumber tidak dikenal)"
            echo "- **Android (Play Store)**: \`animetube-release.aab\`"
            echo "- **iOS (.ipa)**: Sideload via Sideloadly/AltStore (Apple ID gratis, re-sign tiap 7 hari)"
            echo "- **iOS (simulator)**: \`animetube-ios.app.zip\` untuk Xcode Simulator"
            echo ""
            echo "## 📝 Changelog"
            echo ""
            git log --oneline --no-merges "$RANGE" 2>/dev/null | grep -v "\[skip ci\]" | sed 's/^/- /' || echo "- Initial release"
            echo ""
            echo "## 🚀 Installation"
            echo "**Android**: Download \`animetube.apk\` dan install (izinkan *unknown sources*)."
            echo "**iOS**: Lihat panduan sideload di README."
            echo "**Web**: Kunjungi https://animtubev1.vercel.app"
          } > RELEASE_NOTES.md

          # Tag + push + release
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "AnimeTube v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            release-assets/*

          echo "Release v${VERSION} created successfully"
